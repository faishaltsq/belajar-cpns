name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run
        env:
          NODE_ENV: test

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_ENV: test

      - name: Build
        run: npx next build
